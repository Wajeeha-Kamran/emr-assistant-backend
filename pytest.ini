[pytest]
# Collect ONLY from tests/.
#
# Without this, pytest walks the whole repository and picks up anything matching
# test_*.py or *_test.py. scratch/api_test.py is a hand-run script, not a test:
# it opens a database connection at import time, so collection failed before any
# fixture could run — including the one that creates the test database.
testpaths = tests

# Belt and braces: even inside tests/, only test_*.py is a test. A file named
# something_test.py there would be a scratch file too.
python_files = test_*.py

# Directories never worth walking. Listed explicitly so a stray script dropped
# into any of them can never break the suite again.
norecursedirs = scratch .venv storage docs alembic models .git __pycache__

# Fail on an unregistered marker rather than silently ignoring a typo. Every
# marker used here is registered in tests/conftest.py, and a mistyped -m
# selector should be an error, not an empty run that looks like a pass.
addopts = --strict-markers
