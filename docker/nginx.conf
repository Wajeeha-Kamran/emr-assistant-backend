# Nginx reverse-proxy for TLS termination.
# Used by Module 10.1 (containerization) — not an app code change.
#
# Place TLS cert and key at:
#   /etc/nginx/ssl/cert.pem
#   /etc/nginx/ssl/key.pem
#
# In development, generate self-signed certs with:
#   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#     -keyout key.pem -out cert.pem -subj "/CN=localhost"

upstream emr_backend {
    server app:8000;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS termination
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://emr_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
